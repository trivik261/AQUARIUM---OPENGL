name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev xvfb
          make
          timeout 5s xvfb-run -a ./build/aquarium || test "$?" = 124
